version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ma_deal_os
      POSTGRES_USER: ma_admin
      POSTGRES_PASSWORD: ma_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ma_admin:ma_admin@postgres:5432/ma_deal_os
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
