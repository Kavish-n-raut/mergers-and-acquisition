name: Keep backend warm

# Render's free web service spins down after ~15 min of inactivity, which adds a
# ~50s cold start to the next request. This workflow pings the health endpoint
# every 14 minutes so the instance stays awake. Also runnable on demand.
#
# NOTE: GitHub Actions is unlimited-free on PUBLIC repos. On a PRIVATE repo this
# consumes Actions minutes (~3k/month at this cadence, above the 2,000 free) —
# make the repo public to keep it free, or rely on the external uptime monitor.

on:
  schedule:
    # Every 10 min at offset minutes (avoiding :00, GitHub's peak-load window
    # when scheduled runs are most delayed). Tighter than Render's 15-min idle
    # timeout so a delayed run still lands before the instance sleeps.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://madealos-api.onrender.com/api/v1/health"
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Backend awake (HTTP $code) on attempt $i"
              exit 0
            fi
            echo "Attempt $i: HTTP $code (likely cold start) — retrying in 25s..."
            sleep 25
          done
          echo "Health check did not return 200 after 4 attempts"
          exit 1
